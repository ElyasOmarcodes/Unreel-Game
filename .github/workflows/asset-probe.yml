name: Asset probe (research)

# Read-only research: looks inside the free (CC0) asset downloads the game is going to use.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/asset-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Quaternius Universal Base Characters (itch.io)
        run: |
          P=https://quaternius.itch.io/universal-base-characters
          curl -s -c jar -b jar "$P" -o page.html
          CSRF=$(grep -o 'name="csrf_token" value="[^"]*' page.html | head -1 | sed 's/.*value="//')
          URL=$(curl -s -c jar -b jar -X POST "$P/download_url" -d "csrf_token=$CSRF" | python3 -c "import sys,json;print(json.load(sys.stdin)['url'])")
          KEY=${URL##*/download/}
          curl -s -c jar -b jar -L "$URL" -o dl.html
          UP=$(grep -o 'data-upload_id="[0-9]*"' dl.html | head -1 | grep -o '[0-9]*')
          FILE=$(curl -s -c jar -b jar -X POST "$P/file/$UP?source=game_download&key=$KEY" -d "csrf_token=$CSRF" | python3 -c "import sys,json;print(json.load(sys.stdin)['url'])")
          curl -sL "$FILE" -o ubc.zip
          ls -la ubc.zip
          unzip -l ubc.zip | grep -v "\.blend" | head -150
      - name: Ultimate Gun Pack (FBX part)
        run: |
          curl -sL https://opengameart.org/sites/default/files/ultimate_gun_pack_by_quaternius.zip -o guns.zip
          unzip -l guns.zip | grep -iv "blend" | head -150
      - name: Poly Haven files for some props
        run: |
          for id in old_military_crate concrete_road_barrier metal_trash_can exterior_aircon_unit plastic_crate_03 modular_industrial_pipes_01 propane_tank rusted_wheel_rim_01; do
            curl -s "https://api.polyhaven.com/files/$id" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          print('$id', list(d.keys()))
          f=d.get('fbx',{}).get('1k',{}).get('fbx',{})
          print('  fbx 1k:', f.get('url'), f.get('size'), list(f.get('include',{}).keys())[:6])
          "
          done
          curl -s "https://api.polyhaven.com/assets?t=models&c=industrial" | python3 -c "import sys,json;print(sorted(json.load(sys.stdin).keys()))"
      - name: ambientCG zip contents
        run: |
          curl -sL "https://ambientcg.com/get?file=CorrugatedSteel005_1K-JPG.zip" -o c.zip && unzip -l c.zip
