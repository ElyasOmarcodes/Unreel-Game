name: Asset probe (research)

# Read-only research: looks inside the free (CC0) asset downloads the game is going to use.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/asset-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Quaternius Universal Base Characters (itch.io)
        run: |
          P=https://quaternius.itch.io/universal-base-characters
          curl -s -c jar -b jar "$P" -o page.html
          CSRF=$(grep -o 'name="csrf_token" value="[^"]*' page.html | head -1 | sed 's/.*value="//')
          curl -s -c jar -b jar -X POST "$P/download_url" -d "csrf_token=$CSRF" -o r1.json
          URL=$(python3 -c "import json;print(json.load(open('r1.json'))['url'])")
          RAWKEY=$(python3 -c "import urllib.parse,sys;print(urllib.parse.unquote(sys.argv[1].split('/download/')[1]))" "$URL")
          curl -s -c jar -b jar -L "$URL" -o dl.html
          UP=$(grep -o 'data-upload_id="[0-9]*"' dl.html | head -1 | grep -o '[0-9]*')
          CSRF2=$(grep -o 'name="csrf_token" value="[^"]*' dl.html | head -1 | sed 's/.*value="//')
          for variant in a b c; do
            case $variant in
              a) curl -s -c jar -b jar -X POST "$P/file/$UP?source=game_download" --data-urlencode "key=$RAWKEY" --data-urlencode "csrf_token=$CSRF2" -o r2.json ;;
              b) curl -s -c jar -b jar -X POST "$P/file/$UP" --data-urlencode "key=$RAWKEY" --data-urlencode "csrf_token=$CSRF2" --data "source=game_download" -o r2.json ;;
              c) curl -s -c jar -b jar -X POST "$P/file/$UP?key=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$RAWKEY")&source=game_download" -H "X-Requested-With: XMLHttpRequest" --data-urlencode "csrf_token=$CSRF2" -o r2.json ;;
            esac
            echo "variant $variant: $(cat r2.json)"
            grep -q '"url"' r2.json && break
          done
          FILE=$(python3 -c "import json;print(json.load(open('r2.json'))['url'])")
          curl -sL "$FILE" -o ubc.zip
          ls -la ubc.zip
          unzip -l ubc.zip | grep -v "\.blend" | head -200
