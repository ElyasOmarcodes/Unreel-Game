name: Probe CC0 asset sources

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe-assets.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List Poly Haven models
        run: |
          curl -s -A "ArenaRush-CI" "https://api.polyhaven.com/assets?t=models" > models.json
          python3 - <<'PY'
          import json
          d=json.load(open("models.json"))
          print(f"===== models: {len(d)}")
          for k,v in sorted(d.items()):
              print("M", k, "|", ",".join(v.get("categories",[])), "|", v.get("polycount",""), "|", v.get("name",""))
          PY
      - name: glTF/FBX layout of candidate models
        run: |
          for id in island_tree_01 island_tree_02 island_tree_03 wooden_crate_01 Barrel_01; do
            echo "===== $id"
            curl -s -A "ArenaRush-CI" "https://api.polyhaven.com/files/$id" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for fmt in ('gltf','fbx'):
              x=d.get(fmt,{}).get('1k',{})
              for k,v in x.items():
                  print('F', fmt, v.get('url'), v.get('size'))
                  for p,i in v.get('include',{}).items(): print('   I', p, i.get('url'), i.get('size'))
          "
          done
